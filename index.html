<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>BWK Zeiterfassung</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">⏱</div>
        <div class="brandtext">
          <div class="name">BWK Zeiterfassung</div>
          <div class="sub">331 · Siedler, Nico · BWK AVöD</div>
        </div>
      </div>

      <div class="top-actions">
        <label class="field compact">
          <span>Monat</span>
          <input id="monthPicker" type="month" />
        </label>

        <button class="btn ghost" id="themeBtn" title="Theme wechseln" aria-label="Theme wechseln">
          <span class="ico" aria-hidden="true">🌓</span>
          <span class="hide-sm">Theme</span>
        </button>
      </div>
    </header>

    <main class="grid">
      <aside class="panel left">
        <section class="card">
          <h2>Monats-Soll</h2>
          <div class="form">
            <label class="field">
              <span>Stunden (Monat)</span>
              <input id="requiredHours" type="number" step="0.25" min="0" />
            </label>

            <label class="field">
              <span>Übertrag (h)</span>
              <input id="carryHours" type="number" step="0.25" />
            </label>

            <div class="row">
            </div>
          </div>
        </section>

        <section class="card">
          <h2>Auswertung</h2>
          <div class="stats">
            <div class="stat">
              <div class="k">Gearbeitet</div>
              <div class="v" id="workedOut">0:00</div>
            </div>
            <div class="stat">
              <div class="k">Soll</div>
              <div class="v" id="targetOut">0:00</div>
            </div>
            <div class="stat">
              <div class="k">Differenz</div>
              <div class="v" id="diffOut">0:00</div>
            </div>
            <div class="stat">
              <div class="k">Rest bis Soll</div>
              <div class="v" id="restOut">0:00</div>
            </div>
            <div class="stat">
              <div class="k">Rest / Arbeitstag</div>
              <div class="v" id="perDayOut">–</div>
            </div>
            <div class="stat">
              <div class="k">Saldo inkl. Übertrag</div>
              <div class="v" id="saldoOut">0:00</div>
            </div>
          </div>
        </section>

        <section class="card">
          <h2>Import/Export</h2>
          <div class="import-export-actions">
            <button class="btn ghost" id="exportJsonBtn">JSON export</button>
            <button class="btn ghost" id="exportCsvBtn">CSV export</button>
            <label class="file">
              <input id="importFile" type="file" accept=".json,application/json" />
              <span class="btn ghost">JSON import</span>
            </label>
            <button class="btn ghost danger" id="clearMonthBtn" title="Aktuellen Monat leeren">Monat leeren</button>
          </div>
        </section>
      </aside>

      <section class="panel right">
        <div class="daylist-head">
          <h1 id="monthTitle">Monat</h1>
          <div class="legend">
            <span class="pill">✓ Arbeitstag</span>
            <span class="pill ghost">– frei</span>
          </div>
        </div>

        <div class="daylist" id="dayList" aria-live="polite"></div>
      </section>
    </main>

    <footer class="footer">
      <span>v<span id="verOut"></span></span>
      <span class="dot">•</span>
      <span>Tip: Auf Mobil kannst du die Tageskarten schnell auf-/zuklappen.</span>
    </footer>
  </div>

  <dialog id="toast" class="toast">
    <div class="toast-inner">
      <div id="toastMsg">OK</div>
      <button class="btn ghost" id="toastClose">Schließen</button>
    </div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
